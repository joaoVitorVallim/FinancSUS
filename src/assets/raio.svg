<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente amarelo vibrante -->
    <linearGradient id="raioGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffff33" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <!-- Efeito de brilho aumentado -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="rotate(25, 100, 150)"> <!-- Gira em torno do centro do raio -->
    <!-- caminhos do raio aqui -->
  


  <!-- Tronco principal do raio -->
  
  <path
    d="M100 0 
       L95 40 
       L110 60 
       L90 90 
       L105 120 
       L85 160 
       L100 200 
       L95 240 
       L100 300"
    stroke="url(#raioGrad)"
    stroke-width="2.5"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Ramificações laterais -->
  <path
    d="M95 40 L80 60 L90 80"
    stroke="url(#raioGrad)"
    stroke-width="1.8"
    fill="none"
    filter="url(#glow)"
  />
  <path
    d="M105 120 L120 140 L110 160"
    stroke="url(#raioGrad)"
    stroke-width="1.8"
    fill="none"
    filter="url(#glow)"
  />
  <path
    d="M95 240 L80 260 L90 280"
    stroke="url(#raioGrad)"
    stroke-width="1.8"
    fill="none"
    filter="url(#glow)"
  />
  </g>
</svg>
